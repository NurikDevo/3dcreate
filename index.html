<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio 3D Model Maker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='4' y='8' width='16' height='10' rx='1' fill='%2335b5ff'/><path d='M7 8l3-4h7l3 4z' fill='%2335b5ff'/></svg>">
<style>
  :root{
    --bg:#1e1e1e; --bar:#2b2b2b; --bar-hover:#3a3a3a; --panel:#252525;
    --border:#3d3d3d; --text:#e8e8e8; --text-dim:#9a9a9a;
    --accent:#35b5ff; --accent-dim:#1c7fb8; --danger:#e74c3c;
    --sel:#35b5ff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{
    font-family:"Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:var(--bg); color:var(--text); font-size:13px;
    display:flex; flex-direction:column; user-select:none;
  }

  /* ---------- menu bar ---------- */
  #menubar{display:flex; align-items:center; background:var(--bar); border-bottom:1px solid var(--border); height:30px; padding:0 6px; flex:none;}
  .menu{position:relative;}
  .menu-btn{
    background:none; border:none; color:var(--text); font:inherit; padding:5px 12px; cursor:pointer; border-radius:3px;
  }
  .menu-btn:hover, .menu.open .menu-btn{background:var(--bar-hover);}
  .menu-list{
    display:none; position:absolute; top:100%; left:0; min-width:210px; background:#333;
    border:1px solid var(--border); border-radius:4px; box-shadow:0 6px 18px rgba(0,0,0,.5); z-index:100; padding:4px 0;
  }
  .menu.open .menu-list{display:block;}
  .menu-list button{
    display:flex; justify-content:space-between; align-items:center; width:100%; background:none; border:none;
    color:var(--text); font:inherit; padding:6px 14px; cursor:pointer; text-align:left;
  }
  .menu-list button:hover{background:var(--accent); color:#fff;}
  .menu-list button .kbd{color:var(--text-dim); font-size:11px;}
  .menu-list button:hover .kbd{color:#d8ecff;}
  .menu-list .sep{height:1px; background:var(--border); margin:4px 0;}
  .menu-title{margin-left:2px; font-weight:600; color:var(--text-dim); padding:8px 14px 3px; font-size:11px; text-transform:uppercase; letter-spacing:.05em;}
  .menu-title:first-child{padding-top:4px;}

  /* ---------- toolbar ---------- */
  #toolbar{
    display:flex; align-items:center; gap:4px; background:var(--bar); border-bottom:1px solid var(--border);
    height:40px; padding:0 8px; flex:none; overflow-x:auto;
  }
  .tb-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    min-width:52px; height:32px; padding:2px 8px; background:#333; border:1px solid var(--border);
    border-radius:4px; color:var(--text); font:inherit; font-size:10px; cursor:pointer; white-space:nowrap;
  }
  .tb-btn:hover{border-color:var(--accent); background:#3d3d3d;}
  .tb-btn.active{background:var(--accent-dim); border-color:var(--accent);}
  .tb-btn:disabled{opacity:0.35; cursor:default;}
  .tb-btn:disabled:hover{border-color:var(--border); background:#333;}
  .tb-btn svg{width:16px; height:16px; display:block;}
  .tb-sep{width:1px; height:26px; background:var(--border); margin:0 4px; flex:none;}
  .tb-spacer{flex:1;}

  /* ---------- main layout ---------- */
  #main{flex:1; display:flex; min-height:0;}
  #viewport{flex:1; position:relative; min-width:0;}
  #viewport canvas{display:block; touch-action:none; cursor:default;}
  #viewport.grabbing canvas{cursor:grabbing;}

  #hint{
    position:absolute; left:12px; bottom:12px; background:rgba(20,20,20,.75); border:1px solid var(--border);
    border-radius:6px; padding:8px 12px; color:var(--text-dim); font-size:11px; line-height:1.6; pointer-events:none;
  }
  #hint b{color:var(--text); font-weight:600;}
  #stats{position:absolute; right:12px; top:10px; background:rgba(20,20,20,.6); border:1px solid var(--border); border-radius:6px; padding:4px 10px; color:var(--text-dim); font-size:11px; pointer-events:none;}
  .panel-toggle{display:none;}

/* delightex-style floating tool card above the selected part */
#sel-tools{
  position:absolute; display:none; z-index:20;
  background:#fff; border-radius:12px; padding:7px;
  box-shadow:0 8px 28px rgba(0,0,0,.4);
  transform:translate(-50%, calc(-100% - 14px));
}
#sel-tools::after{
  content:''; position:absolute; left:50%; bottom:-6px; transform:translateX(-50%);
  border:7px solid transparent; border-top-color:#fff; border-bottom:none;
}
#sel-tools .st-grid{ display:grid; grid-template-columns:46px 46px; gap:6px; }
.st-btn{
  width:46px; height:46px; border-radius:50%; border:none; background:#eef0f6; cursor:pointer;
  display:flex; align-items:center; justify-content:center; color:#3a3f52;
}
.st-btn:hover{ background:#dfe3ee; }
.st-btn.active{ background:var(--accent); color:#fff; }
.st-btn svg{ width:21px; height:21px; }

/* value badge shown while rotating / resizing */
#drag-badge{
  position:absolute; display:none; z-index:20; pointer-events:none;
  background:#fff; color:#222; border-radius:12px; padding:3px 10px;
  font-size:12px; font-weight:600; box-shadow:0 4px 14px rgba(0,0,0,.35);
  transform:translate(-50%, -150%);
}

/* orientation cube (delightex-style, top-right) */
#view-cube{
  position:absolute; top:44px; right:12px; width:112px; height:112px;
  z-index:15; pointer-events:none;
}

/* snapping dropdown (delightex-style) */
#snap-menu{
  position:fixed; display:none; z-index:300;
  background:#333; border:1px solid var(--border); border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.55); padding:10px 14px; min-width:220px;
}
#snap-menu.open{ display:block; }
#snap-menu label{
  display:flex; align-items:center; gap:9px; padding:6px 0; cursor:pointer;
  color:var(--text); font-size:12px; white-space:nowrap;
}
#snap-menu input{ accent-color: var(--accent); width:15px; height:15px; }
#snap-menu .kbd{ color:var(--text-dim); font-size:11px; margin-left:auto; padding-left:18px; }

  .panel{
    width:210px; flex:none; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; min-height:0;
  }
  .panel.right{border-right:none; border-left:1px solid var(--border);}
  .panel h3{
    font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim);
    padding:9px 12px; border-bottom:1px solid var(--border); flex:none; font-weight:600;
  }
  #explorer-list{flex:1; overflow-y:auto; padding:4px 0;}
  .explorer-item{
    display:flex; align-items:center; gap:7px; padding:5px 12px; cursor:pointer; color:var(--text);
  }
  .explorer-item:hover{background:#2e2e2e;}
  .explorer-item.selected{background:var(--accent-dim);}
  .explorer-item .dot{width:10px; height:10px; border-radius:2px; flex:none; border:1px solid rgba(0,0,0,.4);}
  .explorer-item .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* ---------- properties ---------- */
  #props{flex:1; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:10px;}
  #props .empty{color:var(--text-dim); font-size:12px; padding:6px 2px;}
  .field label{display:block; font-size:11px; color:var(--text-dim); margin-bottom:3px;}
  .field input[type=text], .field input[type=number]{
    width:100%; background:#1a1a1a; border:1px solid var(--border); color:var(--text);
    font:inherit; padding:5px 8px; border-radius:4px;
  }
  .field input:focus{outline:none; border-color:var(--accent);}
  .axis-row{display:flex; gap:6px;}
  .axis-row .field{flex:1;}
  .axis-row label span{color:var(--sel);}
  #swatches{display:grid; grid-template-columns:repeat(6, 1fr); gap:4px;}
  #swatches button{
    width:100%; aspect-ratio:1; border:1px solid rgba(0,0,0,.5); border-radius:3px; cursor:pointer;
  }
  #swatches button:hover{transform:scale(1.12); border-color:#fff;}
  .btn-row{display:flex; gap:6px;}
  .btn{
    flex:1; background:#333; border:1px solid var(--border); color:var(--text); font:inherit;
    padding:6px 8px; border-radius:4px; cursor:pointer;
  }
  .btn:hover{background:#3d3d3d; border-color:var(--accent);}
  .btn.danger:hover{border-color:var(--danger); background:#4a2626;}
  .btn.primary{background:var(--accent-dim); border-color:var(--accent);}
  .btn.primary:hover{background:var(--accent); color:#fff;}

  /* ---------- save modal ---------- */
  #modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:200;
  }
  #modal-overlay.open{display:flex;}
  #modal{
    width:400px; max-width:calc(100vw - 32px); background:var(--panel); border:1px solid var(--border);
    border-radius:8px; box-shadow:0 12px 40px rgba(0,0,0,.6);
  }
  #modal header{padding:12px 16px; border-bottom:1px solid var(--border); font-size:14px; font-weight:600;}
  #modal .body{padding:16px; display:flex; flex-direction:column; gap:14px;}
  #modal .body label{display:block; font-size:11px; color:var(--text-dim); margin-bottom:4px;}
  #modal input[type=text], #modal select{
    width:100%; background:#1a1a1a; border:1px solid var(--border); color:var(--text); font:inherit; padding:7px 9px; border-radius:4px;
  }
  #modal input:focus, #modal select:focus{outline:none; border-color:var(--accent);}
  .type-note{font-size:11px; color:var(--text-dim); margin-top:5px; line-height:1.45;}
  #modal footer{display:flex; justify-content:flex-end; gap:8px; padding:12px 16px; border-top:1px solid var(--border);}
  #modal footer .btn{flex:none; min-width:90px;}

  /* ---------- toast ---------- */
  #toast{
    position:fixed; bottom:24px; left:50%; transform:translate(-50%, 20px); background:#111; color:#fff;
    border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:6px; padding:10px 18px;
    opacity:0; pointer-events:none; transition:all .25s; z-index:300; max-width:80vw;
  }
  #toast.show{opacity:1; transform:translate(-50%, 0);}
  #toast.error{border-left-color:var(--danger);}

  /* ---------- right-click context menu ---------- */
  #ctx-menu{
    display:none; position:fixed; z-index:150; min-width:200px; background:#333;
    border:1px solid var(--border); border-radius:4px; box-shadow:0 6px 18px rgba(0,0,0,.5); padding:4px 0;
  }
  #ctx-menu .ctx-title{
    padding:6px 14px 5px; font-size:11px; color:var(--text-dim); border-bottom:1px solid var(--border);
    margin-bottom:4px; max-width:230px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #ctx-menu button{
    display:flex; justify-content:space-between; align-items:center; width:100%; background:none; border:none;
    color:var(--text); font:inherit; padding:6px 14px; cursor:pointer; text-align:left;
  }
  #ctx-menu button:hover{background:var(--accent); color:#fff;}
  #ctx-menu .sep{height:1px; background:var(--border); margin:4px 0;}
  #ctx-menu .kbd{color:var(--text-dim); font-size:11px;}
  #ctx-menu button:hover .kbd{color:#d8ecff;}

  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-thumb{background:#444; border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---------- narrow screens: panels become slide-over drawers ---------- */
  @media (max-width: 720px){
    #main{position:relative;}
    .panel{
      position:absolute; top:0; bottom:0; width:200px; z-index:40;
      transition:transform .2s ease; box-shadow:none;
    }
    #explorer-panel{left:0; right:auto; transform:translateX(-101%);}
    .panel.right{right:0; left:auto; transform:translateX(101%);}
    #explorer-panel.open, .panel.right.open{transform:none; box-shadow:0 0 18px rgba(0,0,0,.5);}
    #hint{display:none;}
    #toast{bottom:64px;}
    .panel-toggle{
      display:block; position:absolute; bottom:14px; z-index:41;
      background:#333; border:1px solid var(--border); color:var(--text);
      padding:8px 12px; border-radius:6px; cursor:pointer; font:inherit; font-size:12px;
    }
    #toggle-explorer{left:12px;}
    #toggle-props{right:12px;}
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<!-- ======= MENU BAR ======= -->
<div id="menubar">
  <div class="menu" id="menu-file">
    <button class="menu-btn">File</button>
    <div class="menu-list">
      <button data-action="new"><span>New Model</span><span class="kbd">Ctrl+N</span></button>
      <div class="sep"></div>
      <button data-action="open"><span>Open Project (.json)…</span></button>
      <div class="sep"></div>
      <button data-action="save"><span>Save / Export As…</span><span class="kbd">Ctrl+S</span></button>
    </div>
  </div>
  <div class="menu" id="menu-insert">
    <button class="menu-btn">Insert</button>
    <div class="menu-list">
      <div class="menu-title">Basic Parts</div>
      <button data-action="insert:block"><span>Block</span></button>
      <button data-action="insert:sphere"><span>Sphere</span></button>
      <button data-action="insert:cylinder"><span>Cylinder</span></button>
      <button data-action="insert:wedge"><span>Wedge</span></button>
      <button data-action="insert:cone"><span>Cone</span></button>
      <button data-action="insert:torus"><span>Torus</span></button>
    </div>
  </div>
  <div class="menu" id="menu-view">
    <button class="menu-btn">View</button>
    <div class="menu-list">
      <button data-action="resetcam"><span>Reset Camera</span></button>
      <button data-action="togglegrid"><span>Toggle Grid</span></button>
      <button data-action="toggletheme"><span>Light / Dark Sky</span></button>
    </div>
  </div>
  <div class="menu" id="menu-help">
    <button class="menu-btn">Help</button>
    <div class="menu-list">
      <button data-action="about"><span>About This Editor</span></button>
    </div>
  </div>
</div>

<!-- ======= TOOLBAR ======= -->
<div id="toolbar">
  <button class="tb-btn" data-action="new" title="New model">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>
    New
  </button>
  <button class="tb-btn" data-action="save" title="Save / export model">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
    Save
  </button>
  <button class="tb-btn" data-action="undo" id="btn-undo" title="Undo (Ctrl+Z)" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
    Undo
  </button>
  <button class="tb-btn" data-action="redo" id="btn-redo" title="Redo (Ctrl+Y)" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>
    Redo
  </button>
  <div class="tb-sep"></div>
  <button class="tb-btn" data-action="insert:block" title="Insert block">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="8" width="16" height="10" rx="1"/><path d="M7 8l3-4h7l3 4"/></svg>
    Block
  </button>
  <button class="tb-btn" data-action="insert:sphere" title="Insert sphere">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><ellipse cx="12" cy="12" rx="8" ry="3.2"/></svg>
    Sphere
  </button>
  <button class="tb-btn" data-action="insert:cylinder" title="Insert cylinder">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12"/><path d="M19 6v12"/><ellipse cx="12" cy="18" rx="7" ry="3"/></svg>
    Cyl
  </button>
  <button class="tb-btn" data-action="insert:wedge" title="Insert wedge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 18h16L4 6z"/></svg>
    Wedge
  </button>
  <button class="tb-btn" data-action="insert:cone" title="Insert cone">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 16H4z"/><ellipse cx="12" cy="19" rx="8" ry="2.4"/></svg>
    Cone
  </button>
  <button class="tb-btn" data-action="insert:torus" title="Insert torus">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/></svg>
    Torus
  </button>
  <div class="tb-sep"></div>
  <button class="tb-btn active" id="btn-snapping" data-action="toggle-snapping" title="Snapping options">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h7v7H3zM14 14h7v7h-7z"/><path d="M10 6.5h4M6.5 10v4M17.5 14v-4M14 17.5h-4"/></svg>
    Snapping
  </button>
  <div class="tb-sep"></div>
  <button class="tb-btn" data-action="duplicate" title="Duplicate selected part (Ctrl+D)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 4H6a2 2 0 0 0-2 2v10"/></svg>
    Clone
  </button>
  <button class="tb-btn" data-action="delete" title="Delete selected part (Del)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6"/></svg>
    Delete
  </button>
  <div class="tb-spacer"></div>
  <button class="tb-btn active" id="btn-dragger" data-action="toggle-dragger" title="Dragger: drag parts with the mouse (auto ON)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v9M8 8l4 4 4-4"/><path d="M5 14a7 7 0 0 0 14 0"/></svg>
    Dragger ON
  </button>
</div>

<div id="snap-menu">
  <label><input type="checkbox" id="chk-snapgrid" checked> Snap to grid</label>
  <label><input type="checkbox" id="chk-snapitem" checked> Snap to items</label>
</div>

<!-- ======= MAIN ======= -->
<div id="main">
  <div class="panel" id="explorer-panel">
    <h3>Explorer</h3>
    <div id="explorer-list"></div>
  </div>

  <div id="viewport">
    <div id="sel-tools">
    <div class="st-grid">
      <button class="st-btn" data-st="rotate" title="Rotate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3.5v4h-4"/></svg></button>
      <button class="st-btn active" data-st="move" title="Move"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/><path d="M12 3l-2.5 2.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/></svg></button>
      <button class="st-btn" data-st="elevate" title="Move up / down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14M5 20h14"/><path d="M12 7v10"/><path d="M12 7l-3 3M12 7l3 3M12 17l-3-3M12 17l3-3"/></svg></button>
      <button class="st-btn" data-st="scale" title="Resize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6"/><path d="M20 4l-7 7M4 20l7-7"/></svg></button>
    </div>
  </div>
  <div id="drag-badge"></div>
  <canvas id="view-cube" width="112" height="112"></canvas>
  <div id="stats">0 parts</div>
    <div id="hint">
      <b>Drag part</b> to move &nbsp;·&nbsp; <b>arrows</b> slide &nbsp;·&nbsp; <b>yellow ring</b> turns &nbsp;·&nbsp; <b>orange cubes</b> resize<br>
      <b>Right-drag</b> orbit &nbsp;·&nbsp; <b>Shift+drag</b> up/down &nbsp;·&nbsp; <b>Right-click</b> part for menu
    </div>
    <button class="panel-toggle" id="toggle-explorer">☰ Explorer</button>
    <button class="panel-toggle" id="toggle-props">Properties ⚙</button>
  </div>

  <div class="panel right">
    <h3>Properties</h3>
    <div id="props">
      <div class="empty">Select a part to edit its name, color, size and position.</div>
    </div>
  </div>
</div>

<!-- ======= SAVE MODAL ======= -->
<div id="modal-overlay">
  <div id="modal">
    <header>Save Model</header>
    <div class="body">
      <div>
        <label for="save-name">Model name</label>
        <input type="text" id="save-name" value="MyModel" spellcheck="false">
      </div>
      <div>
        <label for="save-type">File type</label>
        <select id="save-type">
          <option value="glb">GLB — 3D model, keeps colors (recommended)</option>
          <option value="obj">OBJ — 3D model, geometry only</option>
          <option value="stl">STL — 3D printing, geometry only</option>
          <option value="json">JSON — project file, reopen in this editor</option>
        </select>
        <div class="type-note" id="type-note"></div>
      </div>
    </div>
    <footer>
      <button class="btn" id="save-cancel">Cancel</button>
      <button class="btn primary" id="save-confirm">Save</button>
    </footer>
  </div>
</div>

<input type="file" id="open-file" accept=".json,application/json" hidden>
<div id="toast"></div>

<div id="ctx-menu">
  <div class="ctx-title" id="ctx-part-name">Part</div>
  <button data-cmd="duplicate"><span>Clone</span><span class="kbd">Ctrl+D</span></button>
  <button data-cmd="delete"><span>Delete</span><span class="kbd">Del</span></button>
  <div class="sep"></div>
  <button data-cmd="undo"><span>Undo</span><span class="kbd">Ctrl+Z</span></button>
  <button data-cmd="redo"><span>Redo</span><span class="kbd">Ctrl+Y</span></button>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { OBJExporter } from 'three/addons/exporters/OBJExporter.js';
import { STLExporter } from 'three/addons/exporters/STLExporter.js';

/* ================================================================
   Scene setup
================================================================ */
const viewport = document.getElementById('viewport');

let selected = null;
let draggerOn = true;  // "drag in item" is automatically ON
let snapGrid = true;
let snapItem = true;

/* ---------- undo / redo history ---------- */
let history = [];      // snapshots of the parts list
let histIndex = -1;
let restoring = false; // true while history restores, so mutations don't re-record

function snapshot(){
  return parts.map(p => ({
    name: p.name, shape: p.userData.shape,
    color: '#' + p.material.color.getHexString(),
    size: [p.scale.x, p.scale.y, p.scale.z],
    position: [p.position.x, p.position.y, p.position.z],
    rotation: [p.rotation.x, p.rotation.y, p.rotation.z]
  }));
}

function pushHistory(){
  if (restoring) return;
  history = history.slice(0, histIndex + 1);
  history.push(snapshot());
  if (history.length > 100) history.shift();
  histIndex = history.length - 1;
  updateUndoButtons();
}

function resetHistory(){
  history = [snapshot()];
  histIndex = 0;
  updateUndoButtons();
}

function restoreState(state){
  const prevSel = selected ? selected.name : null;
  restoring = true;
  clearModel();
  state.forEach(d => addPart(d.shape, {
    name: d.name, color: d.color, size: d.size, position: d.position, rotation: d.rotation, rotY: d.rotY
  }));
  restoring = false;
  // keep the same part selected across undo/redo when it still exists
  const again = prevSel ? parts.find(p => p.name === prevSel) : null;
  selectPart(again || null);
  refreshExplorer();
  refreshStats();
}

function undo(){
  if (histIndex <= 0){ toast('Nothing to undo'); return; }
  histIndex--;
  restoreState(history[histIndex]);
  updateUndoButtons();
  toast('Undo');
}

function redo(){
  if (histIndex >= history.length - 1){ toast('Nothing to redo'); return; }
  histIndex++;
  restoreState(history[histIndex]);
  updateUndoButtons();
  toast('Redo');
}

function updateUndoButtons(){
  document.getElementById('btn-undo').disabled = histIndex <= 0;
  document.getElementById('btn-redo').disabled = histIndex >= history.length - 1;
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x272b33);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 2000);
camera.position.set(14, 12, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
viewport.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.mouseButtons = {
  LEFT: null,               // left button reserved for part dragging / selection
  MIDDLE: THREE.MOUSE.DOLLY,
  RIGHT: THREE.MOUSE.ROTATE
};

scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(20, 30, 15);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.5);
fill.position.set(-15, 10, -20);
scene.add(fill);

const grid = new THREE.GridHelper(60, 60, 0x5a6272, 0x39404d);
scene.add(grid);

// All user parts live in modelGroup — helpers stay outside so exports are clean.
const modelGroup = new THREE.Group();
scene.add(modelGroup);

// Selection outline
const selBox = new THREE.BoxHelper(undefined, 0x35b5ff);
selBox.visible = false;
scene.add(selBox);

/* ---------- selection gizmo: drag handles on the selected part ----------
   arrows = slide along an axis, yellow ring = rotate, orange cubes = resize.
   Handles are drawn on top of the scene and are picked before parts. */
const AXIS = {
  x: new THREE.Vector3(1, 0, 0),
  y: new THREE.Vector3(0, 1, 0),
  z: new THREE.Vector3(0, 0, 1)
};
const gizmo = new THREE.Group();
gizmo.visible = false;
const gizmoScene = new THREE.Scene();   // overlay pass: handles sort correctly among themselves
gizmoScene.add(gizmo);
const gizmoHits = [];  // invisible but pickable hit volumes

function gizmoMat(color){ return new THREE.MeshBasicMaterial({ color }); }
function hitMat(){ return new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }); }

let gizmoMode = 'move';   // 'move' | 'rotate' | 'elevate' | 'scale' (delightex-style tool card)
function setGizmoMode(m){
  gizmoMode = m;
  document.querySelectorAll('#sel-tools .st-btn').forEach(b => b.classList.toggle('active', b.dataset.st === m));
  updateGizmo();
}

const arrows = {};
const gizmoVisuals = [];   // all visible handle geometry — precise first-stage picking
for (const [axis, color] of [['x', 0xff4d4d], ['y', 0x4dff77], ['z', 0x4d9dff]]){
  const g = new THREE.Group();
  const mat = gizmoMat(color);
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.55, 12), mat);
  shaft.position.y = 0.275;
  shaft.userData.gizmoType = 'move';
  shaft.userData.axis = axis;
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.32, 12), mat);
  tip.position.y = 0.71;
  tip.userData.gizmoType = 'move';
  tip.userData.axis = axis;
  gizmoVisuals.push(shaft, tip);
  const hit = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 1.1, 8), hitMat());
  hit.position.y = 0.55;
  hit.userData.gizmoType = 'move';
  hit.userData.axis = axis;
  gizmoHits.push(hit);
  g.add(shaft, tip, hit);
  if (axis === 'x') g.rotation.z = -Math.PI / 2;
  if (axis === 'z') g.rotation.x = Math.PI / 2;
  arrows[axis] = g;
  gizmo.add(g);
}

/* elevation tool: vertical double-headed arrow (delightex raise/lower) */
const elevGizmo = new THREE.Group();
{
  const mat = gizmoMat(0xffd24d);
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1, 12), mat);
  const up = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.34, 12), mat);
  const down = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.34, 12), mat);
  down.rotation.x = Math.PI;
  shaft.userData.gizmoType = 'move'; shaft.userData.axis = 'y';
  up.userData.gizmoType = 'move'; up.userData.axis = 'y';
  down.userData.gizmoType = 'move'; down.userData.axis = 'y';
  gizmoVisuals.push(shaft, up, down);
  const hit = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 1.8, 8), hitMat());
  hit.userData.gizmoType = 'move'; hit.userData.axis = 'y';
  gizmoHits.push(hit);
  elevGizmo.add(shaft, up, down, hit);
  elevGizmo.userData = { shaft, up, down, hit };
  gizmo.add(elevGizmo);
}

/* rotation rings for all three axes (blue = turn, red/green = tilt) */
const rings = {};
for (const [axis, color] of [['x', 0xff4d4d], ['y', 0x4d9dff], ['z', 0x4dff77]]){
  const g = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1, 0.045, 8, 64), gizmoMat(color));
  ring.userData.gizmoType = 'rot'; ring.userData.axis = axis;
  gizmoVisuals.push(ring);
  const hit = new THREE.Mesh(new THREE.TorusGeometry(1, 0.12, 8, 48), hitMat());
  hit.userData.gizmoType = 'rot'; hit.userData.axis = axis;
  gizmoHits.push(hit);
  if (axis === 'y') g.rotation.x = Math.PI / 2;
  if (axis === 'x') g.rotation.y = Math.PI / 2;
  g.add(ring, hit);
  rings[axis] = g;
  gizmo.add(g);
}

const scaleHandles = [];
for (const sx of [1, -1]) for (const sy of [1, -1]) for (const sz of [1, -1]){
  const g = new THREE.Group();
  const cube = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.22, 0.22), gizmoMat(0xffa040));
  cube.userData.gizmoType = 'scale';
  cube.userData.signs = [sx, sy, sz];
  const hit = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), hitMat());
  hit.userData.gizmoType = 'scale';
  hit.userData.signs = [sx, sy, sz];
  gizmoHits.push(hit);
  gizmoVisuals.push(cube);
  g.add(cube, hit);
  scaleHandles.push({ g, signs: [sx, sy, sz] });
  gizmo.add(g);
}

/* stretch handles: one per face — pull any side to grow/shrink from that side */
const stretchHandles = [];
for (const axis of ['x', 'y', 'z']) for (const sign of [1, -1]){
  const g = new THREE.Group();
  const cube = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.24, 0.24), gizmoMat(0xffa040));
  cube.userData.gizmoType = 'stretch'; cube.userData.axis = axis; cube.userData.sign = sign;
  gizmoVisuals.push(cube);
  const hit = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.55, 0.55), hitMat());
  hit.userData.gizmoType = 'stretch'; hit.userData.axis = axis; hit.userData.sign = sign;
  gizmoHits.push(hit);
  g.add(cube, hit);
  stretchHandles.push({ g, axis, sign });
  gizmo.add(g);
}

gizmo.traverse(o => { o.renderOrder = 999; });

const _gb = new THREE.Box3();
const _gc = new THREE.Vector3();
const _gs = new THREE.Vector3();
function updateGizmo(){
  if (!selected){ gizmo.visible = false; return; }
  _gb.setFromObject(selected);
  if (_gb.isEmpty()){ gizmo.visible = false; return; }
  gizmo.visible = true;
  _gb.getCenter(_gc);
  _gb.getSize(_gs);
  const hx = _gs.x / 2, hy = _gs.y / 2, hz = _gs.z / 2;

  // Move mode: axis arrows
  const showMove = gizmoMode === 'move';
  arrows.x.visible = arrows.y.visible = arrows.z.visible = showMove;
  if (showMove){
    arrows.x.position.set(_gc.x + hx + 0.1, _gc.y, _gc.z);
    arrows.y.position.set(_gc.x, _gc.y + hy + 0.1, _gc.z);
    arrows.z.position.set(_gc.x, _gc.y, _gc.z + hz + 0.1);
  }

  // Elevation mode: vertical double arrow through the part
  const showElev = gizmoMode === 'elevate';
  elevGizmo.visible = showElev;
  if (showElev){
    const len = hy * 2 + 1.4;
    elevGizmo.position.copy(_gc);
    elevGizmo.userData.shaft.scale.y = len;
    elevGizmo.userData.up.position.y = len / 2 + 0.17;
    elevGizmo.userData.down.position.y = -len / 2 - 0.17;
    elevGizmo.userData.hit.scale.y = len + 0.7;
  }

  // Rotate mode: three rings
  const showRot = gizmoMode === 'rotate';
  for (const a of ['x', 'y', 'z']) rings[a].visible = showRot;
  if (showRot){
    const setRing = (a, r) => { rings[a].position.copy(_gc); rings[a].scale.set(r, r, 1); };
    setRing('y', Math.max(hx, hz) + 0.45);
    setRing('x', Math.max(hy, hz) + 0.45);
    setRing('z', Math.max(hx, hy) + 0.45);
  }

  // Scale mode: corner cubes (whole-object) + face handles (single-side stretch)
  const showScale = gizmoMode === 'scale';
  for (const h of scaleHandles) h.g.visible = showScale;
  for (const h of stretchHandles) h.g.visible = showScale;
  if (showScale){
    for (const h of scaleHandles){
      h.g.position.set(
        _gc.x + h.signs[0] * hx,
        _gc.y + h.signs[1] * hy,
        _gc.z + h.signs[2] * hz
      );
    }
    for (const h of stretchHandles){
      // local face center -> world (correct for rotated parts)
      // unit-box local half extent: localToWorld applies part.scale itself
      const lp = { x: [h.sign * 0.5, 0, 0], y: [0, h.sign * 0.5, 0], z: [0, 0, h.sign * 0.5] }[h.axis];
      h.g.position.copy(selected.localToWorld(new THREE.Vector3(lp[0], lp[1], lp[2])));
    }
  }
}

function resize(){
  const w = viewport.clientWidth, h = viewport.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  renderer.setPixelRatio(window.devicePixelRatio);
}
window.addEventListener('resize', resize);
new ResizeObserver(resize).observe(viewport);

/* ================================================================
   View cube — top-right widget that shows where you're looking.
   Click a face to snap the camera to that side.
================================================================ */
const VC_SIZE = 112, VC_RIGHT = 12, VC_TOP = 44;
const viewCubeScene = new THREE.Scene();
const viewCam = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
function vcFace(label, bg, fg){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = bg; x.fillRect(0, 0, 128, 128);
  x.strokeStyle = 'rgba(0,0,0,.28)'; x.lineWidth = 5; x.strokeRect(0, 0, 128, 128);
  x.fillStyle = fg; x.font = 'bold 26px Segoe UI, Arial, sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(label, 64, 66);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const vcube = new THREE.Mesh(new THREE.BoxGeometry(2.3, 2.3, 2.3), [
  new THREE.MeshBasicMaterial({ map: vcFace('Right',  '#e8704a', '#fff') }),
  new THREE.MeshBasicMaterial({ map: vcFace('Left',   '#a83a2a', '#fff') }),
  new THREE.MeshBasicMaterial({ map: vcFace('Top',    '#5a9cf5', '#fff') }),
  new THREE.MeshBasicMaterial({ map: vcFace('Bottom','#2c5385', '#fff') }),
  new THREE.MeshBasicMaterial({ map: vcFace('Front',  '#57b358', '#0e2a10') }),
  new THREE.MeshBasicMaterial({ map: vcFace('Back',   '#2c6e2e', '#fff') })
]);
viewCubeScene.add(vcube);
viewCubeScene.add(new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(2.36, 2.36, 2.36)),
  new THREE.LineBasicMaterial({ color: 0x10141c })
));
const vcNormals = [
  new THREE.Vector3(1, 0, 0), new THREE.Vector3(-1, 0, 0),
  new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, -1, 0),
  new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, -1)
];
const vRaycaster = new THREE.Raycaster();
let camTween = null;
function viewCubeClick(e){
  const rect = renderer.domElement.getBoundingClientRect();
  const lx = e.clientX - rect.left, ly = e.clientY - rect.top;
  const x0 = rect.width - VC_RIGHT - VC_SIZE, y0 = VC_TOP;
  if (lx < x0 || lx > x0 + VC_SIZE || ly < y0 || ly > y0 + VC_SIZE) return false;
  const ndcX = ((lx - x0) / VC_SIZE) * 2 - 1;
  const ndcY = -(((ly - y0) / VC_SIZE) * 2 - 1);
  vRaycaster.setFromCamera({ x: ndcX, y: ndcY }, viewCam);
  const hits = vRaycaster.intersectObject(vcube);
  if (!hits.length) return true;   // clicked the cube area but missed the cube: swallow it
  const faceIndex = hits[0].face.materialIndex;
  const n = vcNormals[faceIndex];
  const dist = camera.position.distanceTo(controls.target);
  camTween = {
    from: camera.position.clone(),
    to: controls.target.clone().addScaledVector(n, dist),
    t: 0
  };
  return true;
}

/* ================================================================
   Floating tool card + value badge
================================================================ */
const selTools = document.getElementById('sel-tools');
const dragBadge = document.getElementById('drag-badge');
document.querySelectorAll('#sel-tools .st-btn').forEach(b =>
  b.addEventListener('click', () => setGizmoMode(b.dataset.st))
);
function positionSelTools(){
  if (!selected || drag){ selTools.style.display = 'none'; return; }
  _gb.setFromObject(selected);
  if (_gb.isEmpty()){ selTools.style.display = 'none'; return; }
  _gb.getCenter(_gc);
  _gb.getSize(_gs);
  const p = new THREE.Vector3(_gc.x, _gc.y + _gs.y / 2 + 1.0, _gc.z);
  p.project(camera);
  if (p.z > 1){ selTools.style.display = 'none'; return; }
  const rect = renderer.domElement.getBoundingClientRect();
  selTools.style.display = 'block';
  selTools.style.left = ((p.x * 0.5 + 0.5) * rect.width) + 'px';
  selTools.style.top = ((-p.y * 0.5 + 0.5) * rect.height) + 'px';
}
function showBadge(e, text){
  dragBadge.textContent = text;
  dragBadge.style.display = 'block';
  const rect = renderer.domElement.getBoundingClientRect();
  dragBadge.style.left = (e.clientX - rect.left) + 'px';
  dragBadge.style.top = (e.clientY - rect.top) + 'px';
}
function hideBadge(){ dragBadge.style.display = 'none'; }

/* ================================================================
   Snapping dropdown (delightex-style)
================================================================ */
const snapMenu = document.getElementById('snap-menu');
const chkSnapGrid = document.getElementById('chk-snapgrid');
const chkSnapItem = document.getElementById('chk-snapitem');
const btnSnapping = document.getElementById('btn-snapping');
function openSnapMenu(){
  const r = btnSnapping.getBoundingClientRect();
  snapMenu.style.left = Math.min(r.left, innerWidth - 240) + 'px';
  snapMenu.style.top = (r.bottom + 6) + 'px';
  snapMenu.classList.add('open');
}
chkSnapGrid.addEventListener('change', () => {
  snapGrid = chkSnapGrid.checked;
  btnSnapping.classList.toggle('active', snapGrid || snapItem);
});
chkSnapItem.addEventListener('change', () => {
  snapItem = chkSnapItem.checked;
  btnSnapping.classList.toggle('active', snapGrid || snapItem);
});
document.addEventListener('pointerdown', e => {
  if (!snapMenu.contains(e.target) && e.target !== btnSnapping && !btnSnapping.contains(e.target)){
    snapMenu.classList.remove('open');
  }
}, true);

/* ================================================================
   Render loop
================================================================ */
(function animate(){
  requestAnimationFrame(animate);
  controls.update();
  if (camTween){
    camTween.t = Math.min(1, camTween.t + 0.14);
    const k = camTween.t * camTween.t * (3 - 2 * camTween.t);   // smoothstep
    camera.position.lerpVectors(camTween.from, camTween.to, k);
    if (camTween.t >= 1) camTween = null;
  }
  if (selected && selBox.visible) selBox.setFromObject(selected);
  updateGizmo();
  positionSelTools();
  renderer.autoClear = false;
  renderer.clear();
  renderer.render(scene, camera);
  renderer.clearDepth();                    // handles always draw over the scene...
  renderer.render(gizmoScene, camera);      // ...but depth-sort against each other

  // orientation cube in the top-right corner
  const cw = renderer.domElement.clientWidth, chh = renderer.domElement.clientHeight;
  const vx = cw - VC_RIGHT - VC_SIZE, vy = chh - VC_TOP - VC_SIZE;
  renderer.setViewport(vx, vy, VC_SIZE, VC_SIZE);
  renderer.setScissor(vx, vy, VC_SIZE, VC_SIZE);
  renderer.setScissorTest(true);
  renderer.clear(true, true, false);
  viewCam.position.copy(camera.position).sub(controls.target).setLength(7);
  viewCam.lookAt(0, 0, 0);
  renderer.render(viewCubeScene, viewCam);
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, cw, chh);
})();
resize();

/* ================================================================
   Part shapes
================================================================ */
function wedgeGeometry(){
  const shape = new THREE.Shape();
  shape.moveTo(-0.5, -0.5);
  shape.lineTo(0.5, -0.5);
  shape.lineTo(-0.5, 0.5);
  shape.closePath();
  const g = new THREE.ExtrudeGeometry(shape, { depth: 1, bevelEnabled: false });
  g.center();
  return g;
}

const UNIT = {
  block:    { geo: () => new THREE.BoxGeometry(1, 1, 1),                 size: [4, 1, 2] },
  sphere:   { geo: () => new THREE.SphereGeometry(0.5, 32, 16),           size: [3, 3, 3] },
  cylinder: { geo: () => new THREE.CylinderGeometry(0.5, 0.5, 1, 32),    size: [3, 3, 3] },
  wedge:    { geo: wedgeGeometry,                                        size: [4, 1, 2] },
  cone:     { geo: () => new THREE.ConeGeometry(0.5, 1, 32),             size: [3, 3, 3] },
  torus:    { geo: () => new THREE.TorusGeometry(0.32, 0.16, 16, 40),     size: [3, 3, 3] }
};

const SHAPE_LABEL = {
  block: 'Block', sphere: 'Sphere', cylinder: 'Cylinder',
  wedge: 'Wedge', cone: 'Cone', torus: 'Torus'
};

/* ================================================================
   Parts state
================================================================ */
let parts = [];        // THREE.Mesh list
let nameCounters = {};

const BRICK_COLORS = [
  '#F2F3F3', '#A3A2A5', '#6D6E70', '#1B2A35',
  '#F5CD30', '#D7C59A', '#DA8541', '#A05F35',
  '#C4281C', '#FF66CC', '#6E3B3B', '#0D69AC',
  '#4B974B', '#287F47', '#0A5F2E', '#5B8FB9'
];

function nextName(shape){
  nameCounters[shape] = (nameCounters[shape] || 0) + 1;
  return nameCounters[shape] === 1 ? SHAPE_LABEL[shape] : `${SHAPE_LABEL[shape]} ${nameCounters[shape]}`;
}

function addPart(shape, opts = {}){
  const def = UNIT[shape];
  if (!def) return null;
  const geo = def.geo();
  const color = opts.color || '#A3A2A5';
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.05 }));
  mesh.userData.shape = shape;

  const [sx, sy, sz] = opts.size || def.size;
  mesh.scale.set(sx, sy, sz);

  const halfH = 0.5 * sy;
  if (opts.position){
    mesh.position.set(opts.position[0], opts.position[1], opts.position[2]);
  } else {
    const spread = parts.length % 5;
    mesh.position.set((spread - 2) * 2.2, halfH, (Math.floor(parts.length / 5) % 5 - 2) * 2.2);
  }
  if (opts.rotation){ mesh.rotation.set(opts.rotation[0], opts.rotation[1], opts.rotation[2]); }
  else { mesh.rotation.y = opts.rotY || 0; }
  mesh.name = opts.name || nextName(shape);
  mesh.userData.baseName = mesh.name;

  modelGroup.add(mesh);
  parts.push(mesh);
  selectPart(mesh);
  refreshExplorer();
  refreshStats();
  pushHistory();
  return mesh;
}

function removePart(mesh){
  const i = parts.indexOf(mesh);
  if (i === -1) return;
  parts.splice(i, 1);
  modelGroup.remove(mesh);
  mesh.geometry.dispose();
  mesh.material.dispose();
  if (selected === mesh) selectPart(null);
  refreshExplorer();
  refreshStats();
  pushHistory();
}

function clearModel(){
  const was = restoring;
  restoring = true;
  for (const p of [...parts]) removePart(p);
  nameCounters = {};
  restoring = was;
}

function selectPart(mesh){
  selected = mesh;
  if (mesh){
    selBox.setFromObject(mesh);
    selBox.visible = true;
    setGizmoMode('move');   // delightex-style: every selection starts on Move
  } else {
    selBox.visible = false;
  }
  renderProperties();
  refreshExplorer();
}

/* ================================================================
   Selection + dragging (auto ON)
================================================================ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let drag = null; // { part, plane, offset }

function setPointer(e){
  const r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}

function pickPart(e){
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(modelGroup.children, false);
  return hits.length ? { part: hits[0].object, point: hits[0].point } : null;
}

function handleVisible(o){
  let n = o;
  while (n && n !== gizmo){ if (!n.visible) return false; n = n.parent; }
  return n === gizmo;
}
function pickGizmo(e){
  if (!gizmo.visible) return null;
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  // visible geometry is the precise target — the closest visible handle under the pointer wins
  const visHits = raycaster.intersectObjects(gizmoVisuals, false).filter(h => handleVisible(h.object));
  if (visHits.length) return visHits[0].object;
  const hits = raycaster.intersectObjects(gizmoHits, false).filter(h => handleVisible(h.object));
  if (!hits.length) return null;
  // small visible handles win over the rotation ring when they sit along the same ray
  const prio = { scale: 0, stretch: 0, move: 1, rot: 2 };
  const closest = hits[0];
  const nearby = hits.filter(h => h.distance - closest.distance < 0.9);
  return nearby.sort((a, b) =>
    prio[a.object.userData.gizmoType] - prio[b.object.userData.gizmoType] || a.distance - b.distance
  )[0].object;
}

// closest point on an axis line (through `origin`, direction `axis`) to the pointer ray
function closestPointOnAxis(e, origin, axis){
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const rd = raycaster.ray.direction;
  const w0 = new THREE.Vector3().subVectors(origin, raycaster.ray.origin);
  const b = axis.dot(rd);
  const d = axis.dot(w0);
  const denom = 1 - b * b;
  if (Math.abs(denom) < 1e-8) return null;
  const s = (b * rd.dot(w0) - d) / denom;
  return origin.clone().add(axis.clone().multiplyScalar(s));
}

// angle of the pointer around `center` on the plane perpendicular to the ring axis
function pointerAngleOnPlane(e, center, axis){
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const n = axis === 'x' ? new THREE.Vector3(1, 0, 0) : axis === 'z' ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(0, 1, 0);
  const plane = new THREE.Plane(n, -center[axis === 'x' ? 'x' : axis === 'z' ? 'z' : 'y']);
  const pt = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(plane, pt)) return null;
  if (axis === 'x') return Math.atan2(pt.z - center.z, pt.y - center.y);
  if (axis === 'z') return Math.atan2(pt.y - center.y, pt.x - center.x);
  return Math.atan2(pt.z - center.z, pt.x - center.x);
}

renderer.domElement.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;

  // 0) the orientation cube (top-right) snaps the camera — never falls through
  if (viewCubeClick(e)) return;

  // 1) gizmo handles take priority over parts
  const g = pickGizmo(e);
  if (g && selected){
    controls.enabled = false;
    viewport.classList.add('grabbing');
    renderer.domElement.setPointerCapture(e.pointerId);
    const ud = g.userData;
    if (ud.gizmoType === 'move'){
      const pt = closestPointOnAxis(e, selected.position, AXIS[ud.axis]);
      drag = {
        kind: 'move', part: selected, axis: AXIS[ud.axis],
        offset: pt ? pt.clone().sub(selected.position) : new THREE.Vector3()
      };
    } else if (ud.gizmoType === 'rot'){
      drag = {
        kind: 'rot', part: selected, axis: ud.axis, center: selected.position.clone(),
        startAngle: pointerAngleOnPlane(e, selected.position, ud.axis),
        startRot: selected.rotation[ud.axis]
      };
    } else if (ud.gizmoType === 'scale'){
      const corner = new THREE.Vector3(ud.signs[0], ud.signs[1], ud.signs[2]);
      _gb.setFromObject(selected);
      _gb.getSize(_gs);
      corner.multiply(_gs.multiplyScalar(0.5)).normalize();
      const pt = closestPointOnAxis(e, selected.position, corner);
      drag = {
        kind: 'scale', part: selected, axisVec: corner,
        d0: Math.max(0.1, pt ? pt.sub(selected.position).dot(corner) : 1),
        startScale: selected.scale.clone()
      };
    } else if (ud.gizmoType === 'stretch'){
      // fixed start frame: local axis mapped to world, start size, start center
      const worldDir = new THREE.Vector3().copy(AXIS[ud.axis]).applyQuaternion(selected.quaternion).normalize();
      const pt0 = closestPointOnAxis(e, selected.position, worldDir);
      drag = {
        kind: 'stretch', part: selected, axis: ud.axis, sign: ud.sign,
        startSize: selected.scale[ud.axis],
        startCenter: selected.position.clone(),
        worldDir,
        d0: pt0 ? pt0.sub(selected.position).dot(worldDir) : 0
      };
    }
    drag.hist = snapshot();
    return;
  }

  // 2) drag the part body
  const hit = pickPart(e);
  if (!hit) return;
  selectPart(hit.part);
  if (!draggerOn) return;

  const part = hit.part;
  const vertical = !!e.shiftKey;
  const plane = new THREE.Plane();
  if (vertical){
    // Vertical camera-facing plane for up/down movement
    const normal = new THREE.Vector3();
    camera.getWorldDirection(normal);
    normal.y = 0;
    if (normal.lengthSq() < 1e-6) normal.set(0, 0, 1);
    normal.normalize();
    plane.setFromNormalAndCoplanarPoint(normal, part.position);
  } else {
    plane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), part.position);
  }
  // Anchor the drag to where the pointer-down ray crosses the drag plane,
  // so the part never jumps when the drag starts.
  const anchor = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(plane, anchor)) anchor.copy(hit.point);
  drag = {
    kind: 'body', part, plane, offset: anchor.clone().sub(part.position), vertical,
    hist: snapshot()
  };
  controls.enabled = false;
  viewport.classList.add('grabbing');
  renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener('pointermove', e => {
  if (!drag) return;
  const part = drag.part;

  if (drag.kind === 'move'){
    const pt = closestPointOnAxis(e, part.position, drag.axis);
    if (!pt) return;
    const target = pt.sub(drag.offset);
    if (drag.axis === AXIS.y){
      part.position.y = snapY(part, Math.max(0.05, target.y));
    } else if (drag.axis === AXIS.x){
      part.position.x = snapXZ(part, target.x, target.z).x;
    } else {
      part.position.z = snapXZ(part, target.x, target.z).z;
    }
    renderProperties();
    return;
  }

  if (drag.kind === 'rot'){
    const a = pointerAngleOnPlane(e, drag.center, drag.axis);
    if (a === null) return;
    let rot = drag.startRot + (a - drag.startAngle);
    if (snapGrid) rot = Math.round(rot / (Math.PI / 12)) * (Math.PI / 12); // 15-degree steps
    part.rotation[drag.axis] = rot;
    renderProperties();
    const deg = THREE.MathUtils.radToDeg(rot);
    const norm = ((deg % 360) + 540) % 360 - 180;
    showBadge(e, norm.toFixed(1) + '\u00b0');
    return;
  }

  if (drag.kind === 'stretch'){
    const pt = closestPointOnAxis(e, drag.startCenter, drag.worldDir);
    if (!pt) return;
    const d = pt.sub(drag.startCenter).dot(drag.worldDir);
    let newSize = drag.startSize + drag.sign * (d - drag.d0);
    newSize = Math.max(0.2, newSize);
    if (snapGrid) newSize = Math.max(0.5, Math.round(newSize * 2) / 2);
    part.scale[drag.axis] = newSize;
    // keep the opposite face anchored (world direction, so rotated parts work too)
    const off = drag.sign * (newSize - drag.startSize) / 2;
    part.position.copy(drag.startCenter).addScaledVector(drag.worldDir, off);
    renderProperties();
    showBadge(e, newSize.toFixed(1));
    return;
  }

  if (drag.kind === 'scale'){
    const pt = closestPointOnAxis(e, part.position, drag.axisVec);
    if (!pt) return;
    const d = pt.sub(part.position).dot(drag.axisVec);
    const k = Math.max(0.05, d / drag.d0);
    ['x', 'y', 'z'].forEach(ax => {
      let s = drag.startScale[ax] * k;
      if (snapGrid) s = Math.max(0.5, Math.round(s * 2) / 2);
      part.scale[ax] = Math.max(0.2, s);
    });
    renderProperties();
    return;
  }

  // body drag: move along the plane
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const pt = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(drag.plane, pt)){
    const target = pt.sub(drag.offset);
    if (drag.vertical){
      part.position.y = snapY(part, Math.max(0.05, target.y));
    } else {
      const snapped = snapXZ(part, target.x, target.z);
      part.position.x = snapped.x;
      part.position.z = snapped.z;
    }
    renderProperties();
  }
});

/* ---------- snapping ---------- */
function snapXZ(part, x, z){
  let snappedX = false, snappedZ = false;
  if (snapItem){
    for (const o of parts){
      if (o === part) continue;
      if (!snappedX && Math.abs(x - o.position.x) < 0.9){ x = o.position.x; snappedX = true; }
      if (!snappedZ && Math.abs(z - o.position.z) < 0.9){ z = o.position.z; snappedZ = true; }
    }
  }
  // grid snapping only applies to axes that didn't snap to an item
  if (snapGrid){
    if (!snappedX) x = Math.round(x);
    if (!snappedZ) z = Math.round(z);
  }
  return { x, z };
}

function snapY(part, y){
  if (snapItem){
    // rest on top of any part we overlap horizontally (world-space bounds, so rotated parts work)
    const bb = new THREE.Box3().setFromObject(part);
    const halfH = (bb.max.y - bb.min.y) / 2;
    for (const o of parts){
      if (o === part) continue;
      const ob = new THREE.Box3().setFromObject(o);
      const overlapX = bb.max.x > ob.min.x && bb.min.x < ob.max.x;
      const overlapZ = bb.max.z > ob.min.z && bb.min.z < ob.max.z;
      if (overlapX && overlapZ){
        const top = ob.max.y + halfH;
        if (Math.abs(y - top) < 0.85) return top;
      }
    }
  }
  if (snapGrid) y = Math.round(y * 2) / 2;
  return y;
}

let justDragged = false;
function endDrag(){
  hideBadge();
  if (!drag) return;
  const changed = drag.hist && JSON.stringify(drag.hist) !== JSON.stringify(snapshot());
  drag = null;
  justDragged = true;
  controls.enabled = true;
  viewport.classList.remove('grabbing');
  if (changed) pushHistory();
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);
window.addEventListener('blur', endDrag);

/* ---------- right-click menu ---------- */
const ctxMenu = document.getElementById('ctx-menu');
let ctxPending = false;

function showCtxMenu(x, y, part){
  document.getElementById('ctx-part-name').textContent = part.name;
  ctxMenu.style.display = 'block';
  const r = ctxMenu.getBoundingClientRect();
  ctxMenu.style.left = Math.max(4, Math.min(x, window.innerWidth - r.width - 6)) + 'px';
  ctxMenu.style.top = Math.max(4, Math.min(y, window.innerHeight - r.height - 6)) + 'px';
}
function hideCtxMenu(){ ctxMenu.style.display = 'none'; }

// capture phase so this runs before OrbitControls' own right-drag orbit
viewport.addEventListener('pointerdown', e => {
  if (e.button !== 2) return;
  const hit = pickPart(e);
  if (!hit){ hideCtxMenu(); return; }
  controls.enabled = false;   // suppress orbit while the menu is open
  ctxPending = true;
  selectPart(hit.part);
  showCtxMenu(e.clientX, e.clientY, hit.part);
}, true);

// restore camera controls no matter where the right-button release lands (menu included)
window.addEventListener('pointerup', () => {
  if (ctxPending){
    ctxPending = false;
    controls.enabled = true;
  }
}, true);
window.addEventListener('pointercancel', () => {
  if (ctxPending){
    ctxPending = false;
    controls.enabled = true;
  }
}, true);
window.addEventListener('blur', () => {
  if (ctxPending){
    ctxPending = false;
    controls.enabled = true;
  }
});

  hideCtxMenu();

});

document.addEventListener('keydown', e => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && selected){
    e.preventDefault();
    removePart(selected);
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd' && selected){
    e.preventDefault();
    duplicatePart();
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){
    e.preventDefault();
    openSaveModal();
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n'){
    e.preventDefault();
    confirmNew();
  }
  if (e.key === 'Escape') hideCtxMenu();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){
    e.preventDefault();
    e.shiftKey ? redo() : undo();
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y'){
    e.preventDefault();
    redo();
  }
});

function handleAction(action){
  if (action.startsWith('insert:')){
    addPart(action.slice(7));
    toast(`Inserted a ${SHAPE_LABEL[action.slice(7)]} — drag it with the mouse or use its handles.`);
    return;
  }
  switch (action){
    case 'new': confirmNew(); break;
    case 'save': openSaveModal(); break;
    case 'open': document.getElementById('open-file').click(); break;
    case 'resetcam':
      camera.position.set(14, 12, 18);
      controls.target.set(0, 1, 0);
      break;
    case 'togglegrid': grid.visible = !grid.visible; break;
    case 'toggletheme': {
      const dark = scene.background.getHex() === 0x272b33;
      scene.background.set(dark ? 0x9db3c8 : 0x272b33);
      grid.visible = true;
      break;
    }
    case 'toggle-dragger': {
      draggerOn = !draggerOn;
      const b = document.getElementById('btn-dragger');
      b.classList.toggle('active', draggerOn);
      b.lastChild.textContent = draggerOn ? ' Dragger ON' : ' Dragger OFF';
      break;
    }
    case 'toggle-snapping': {
      snapMenu.classList.contains('open') ? snapMenu.classList.remove('open') : openSnapMenu();
      break;
    }
    case 'duplicate': duplicatePart(); break;
    case 'delete': if (selected) removePart(selected); break;
    case 'undo': undo(); break;
    case 'redo': redo(); break;
    case 'about':
      toast('Studio 3D Model Maker — a mini Roblox-Studio-style editor. Insert parts, drag them around, recolor, rename, then Save to download.');
      break;
  }
}

function confirmNew(){
  if (parts.length && !window.confirm('Start a new model? Your current parts will be removed.')) return;
  if (parts.length){
    clearModel();
    pushHistory();
  }
  toast('New model started.');
}

/* ================================================================
   Save / export
================================================================ */
const overlay = document.getElementById('modal-overlay');
const saveName = document.getElementById('save-name');
const saveType = document.getElementById('save-type');
const typeNote = document.getElementById('type-note');

const TYPE_NOTES = {
  glb: 'GLB is a standard 3D model file (glTF binary). Keeps part shapes AND colors. Opens in Blender, Windows 3D Viewer, most game engines.',
  obj: 'OBJ is a widely supported 3D model file. Geometry only — colors are NOT included.',
  stl: 'STL is used for 3D printing. Geometry only — no colors.',
  json: 'A project file for this editor. Save it, then reopen it later with File → Open Project to keep editing.'
};

saveType.addEventListener('change', () => { typeNote.textContent = TYPE_NOTES[saveType.value] || ''; });

function openSaveModal(){
  typeNote.textContent = TYPE_NOTES[saveType.value];
  overlay.classList.add('open');
  saveName.focus();
  saveName.select();
}
document.getElementById('save-cancel').addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });
saveName.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('save-confirm').click(); });

document.getElementById('save-confirm').addEventListener('click', async () => {
  const name = (saveName.value.trim() || 'MyModel');
  const type = saveType.value;
  overlay.classList.remove('open');
  if (parts.length === 0){
    toast('Nothing to save yet — insert a part first.', true);
    return;
  }
  try{
    modelGroup.updateMatrixWorld(true);
    let blob, filename = sanitize(name) + '.' + type;

    if (type === 'json'){
      const data = {
        app: 'studio-3d-model-maker',
        version: 1,
        name,
        parts: parts.map(p => ({
          name: p.name,
          shape: p.userData.shape,
          color: '#' + p.material.color.getHexString(),
          size: [round2(p.scale.x), round2(p.scale.y), round2(p.scale.z)],
          position: [round2(p.position.x), round2(p.position.y), round2(p.position.z)],
          rotation: [round2(p.rotation.x), round2(p.rotation.y), round2(p.rotation.z)]
        }))
      };
      blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });

    } else if (type === 'glb'){
      const result = await new Promise((res, rej) =>
        new GLTFExporter().parse(modelGroup, res, rej, { binary: true, onlyVisible: false }));
      blob = new Blob([result], { type: 'model/gltf-binary' });

    } else if (type === 'obj'){
      const text = new OBJExporter().parse(modelGroup);
      blob = new Blob([text], { type: 'text/plain' });

    } else if (type === 'stl'){
      const data = new STLExporter().parse(modelGroup, { binary: true });
      blob = new Blob([data], { type: 'model/stl' });
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast(`Saved "${filename}" (${formatBytes(blob.size)}).`);
  } catch (err){
    console.error(err);
    toast('Export failed: ' + (err && err.message ? err.message : err), true);
  }
});

function sanitize(name){
  return name.replace(/[^a-z0-9-_ ]/gi, '').trim().replace(/\s+/g, '-') || 'model';
}
function formatBytes(n){
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

/* ================================================================
   Open project
================================================================ */
document.getElementById('open-file').addEventListener('change', e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if (data.app !== 'studio-3d-model-maker') throw new Error('not a Studio project file');
      clearModel();
      (data.parts || []).forEach(p => addPart(p.shape, {
        name: p.name, color: p.color, size: p.size, position: p.position, rotation: p.rotation, rotY: p.rotY
      }));
      selectPart(null);
      resetHistory();
      toast(`Opened "${data.name}" — ${parts.length} parts.`);
    } catch (err){
      toast('Could not open that file: ' + err.message, true);
    }
  };
  reader.readAsText(file);
});

/* ================================================================
   Toast
================================================================ */
let toastTimer;
function toast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}

================================================================ */
refreshExplorer();
refreshStats();
addPart('block', { name: 'Base', color: '#A3A2A5', position: [0, 0.5, 0], size: [8, 1, 8] });
selectPart(null);
resetHistory();
